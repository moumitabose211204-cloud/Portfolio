
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Moumita Bose — Data Analytics and AI portfolio featuring data storytelling, machine learning, dashboards and business insights.">
  <meta name="theme-color" content="#07111f">
  <title>Moumita Bose | Data Analytics & AI</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307111f'/%3E%3Cpath d='M15 46 29 15h7l14 31h-9l-2.6-6.5H26.1L23.5 46H15Zm14-14h6.6L32.3 24 29 32Z' fill='%237be8c8'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #07111f;
      --bg-soft: #0b1728;
      --card: rgba(13, 29, 48, .78);
      --card-solid: #0d1d30;
      --line: rgba(170, 205, 228, .15);
      --text: #f4f8fb;
      --muted: #9db0c2;
      --mint: #7be8c8;
      --mint-dark: #173f3a;
      --blue: #72a8ff;
      --orange: #ffbb77;
      --shadow: 0 24px 80px rgba(0, 0, 0, .3);
      --radius: 24px;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 6%, rgba(65, 145, 255, .14), transparent 25rem),
        radial-gradient(circle at 8% 25%, rgba(123, 232, 200, .09), transparent 23rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      overflow-x: hidden;
    }

    body.light {
      --bg: #f5f8fb;
      --bg-soft: #eaf0f6;
      --card: rgba(255, 255, 255, .86);
      --card-solid: #fff;
      --line: rgba(13, 29, 48, .12);
      --text: #0b1728;
      --muted: #526579;
      --mint-dark: #d8f7ed;
      --shadow: 0 24px 80px rgba(33, 58, 82, .13);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    ::selection {
      background: var(--mint);
      color: #07111f;
    }

    .skip-link {
      position: fixed;
      left: 1rem;
      top: -5rem;
      z-index: 999;
      padding: .75rem 1rem;
      background: var(--mint);
      color: #07111f;
      border-radius: 10px;
    }

    .skip-link:focus {
      top: 1rem;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: .025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    .container {
      width: min(calc(100% - 2.4rem), var(--max));
      margin-inline: auto;
    }

    .section {
      padding: 7rem 0;
      position: relative;
    }

    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 .8rem;
      color: var(--mint);
      text-transform: uppercase;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .section-kicker::before {
      content: "";
      width: 22px;
      height: 1px;
      background: currentColor;
    }

    .section-title {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .section-copy {
      max-width: 650px;
      margin: 1.25rem 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 2rem;
      margin-bottom: 3.2rem;
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 90;
      transition: background .25s ease, border-color .25s ease;
    }

    .site-header.scrolled {
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      font-weight: 850;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #07111f;
      background: var(--mint);
      font-size: .92rem;
      box-shadow: 0 8px 24px rgba(123, 232, 200, .18);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
      transition: color .2s;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: .7rem;
    }

    .icon-btn,
    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--card);
      cursor: pointer;
    }

    .menu-btn {
      display: none;
    }

    .hero {
      min-height: 100svh;
      display: grid;
      align-items: center;
      padding: 8.5rem 0 5rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.02fr .98fr;
      gap: clamp(3rem, 7vw, 7rem);
      align-items: center;
    }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      padding: .48rem .75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
    }

    .availability-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 5px rgba(123, 232, 200, .1);
    }

    .hero h1 {
      margin: 1.7rem 0 1.1rem;
      font-size: clamp(3.3rem, 7vw, 6.8rem);
      line-height: .93;
      letter-spacing: -.07em;
    }

    .hero h1 span {
      color: var(--mint);
    }

    .hero-lead {
      max-width: 600px;
      color: var(--muted);
      font-size: clamp(1.05rem, 1.5vw, 1.25rem);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .9rem;
      margin-top: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      min-height: 50px;
      padding: .8rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-weight: 800;
      font-size: .92rem;
      cursor: pointer;
      transition: transform .2s, border-color .2s, background .2s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: var(--mint);
      color: #07111f;
      border-color: var(--mint);
      box-shadow: 0 12px 30px rgba(123, 232, 200, .16);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
    }

    .arrow {
      transition: transform .2s;
    }

    .btn:hover .arrow {
      transform: translate(3px, -3px);
    }

    .hero-proof {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem 1.5rem;
      margin-top: 2.2rem;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
    }

    .hero-proof span {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
    }

    .hero-proof svg {
      color: var(--mint);
    }

    .dashboard-wrap {
      position: relative;
      perspective: 1000px;
    }

    .dashboard-glow {
      position: absolute;
      inset: 12% 5%;
      background: rgba(80, 165, 255, .18);
      filter: blur(70px);
      border-radius: 50%;
    }

    .dashboard {
      position: relative;
      padding: 1.05rem;
      border: 1px solid rgba(123, 232, 200, .24);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(16, 36, 58, .98), rgba(7, 17, 31, .92));
      box-shadow: var(--shadow);
      transform: rotateY(-4deg) rotateX(2deg);
      transform-style: preserve-3d;
      transition: transform .35s ease;
    }

    body.light .dashboard {
      background: linear-gradient(145deg, #fff, #edf5fb);
    }

    .dashboard:hover {
      transform: rotateY(0) rotateX(0) translateY(-5px);
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .55rem .5rem 1.05rem;
    }

    .dash-title {
      font-size: .88rem;
      font-weight: 800;
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }

    .window-dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #28405a;
    }

    .window-dots i:first-child {
      background: var(--mint);
    }

    .dash-date {
      color: var(--muted);
      font-size: .68rem;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .7rem;
    }

    .metric,
    .chart-card,
    .insight-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .025);
    }

    .metric {
      padding: .85rem;
    }

    .metric-label {
      color: var(--muted);
      font-size: .65rem;
    }

    .metric-value {
      margin-top: .25rem;
      font-size: 1.18rem;
      font-weight: 850;
      letter-spacing: -.03em;
    }

    .metric-change {
      color: var(--mint);
      font-size: .62rem;
      font-weight: 700;
    }

    .chart-card {
      margin-top: .7rem;
      padding: 1rem;
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .7rem;
    }

    .chart-head strong {
      font-size: .76rem;
    }

    .chart-head span {
      color: var(--muted);
      font-size: .6rem;
    }

    .bar-chart {
      height: 150px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-bottom: 1px solid var(--line);
    }

    .bar {
      flex: 1;
      height: var(--h);
      position: relative;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(to top, rgba(114, 168, 255, .25), var(--blue));
      transform-origin: bottom;
      animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both;
      animation-delay: var(--d);
    }

    .bar:nth-child(3n) {
      background: linear-gradient(to top, rgba(123, 232, 200, .22), var(--mint));
    }

    @keyframes grow {
      from {
        transform: scaleY(0);
      }
    }

    .dash-bottom {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: .7rem;
      margin-top: .7rem;
    }

    .insight-card {
      padding: .9rem;
    }

    .insight-label {
      color: var(--mint);
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-weight: 800;
    }

    .insight-card p {
      margin: .35rem 0 0;
      font-size: .72rem;
      line-height: 1.45;
    }

    .donut-wrap {
      display: flex;
      align-items: center;
      gap: .7rem;
    }

    .donut {
      width: 56px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(
        var(--mint) 0 61%,
        var(--blue) 61% 83%,
        var(--orange) 83%
      );
      position: relative;
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      background: var(--card-solid);
    }

    .legend {
      color: var(--muted);
      font-size: .57rem;
      line-height: 1.8;
    }

    .floating-tag {
      position: absolute;
      z-index: 2;
      padding: .55rem .75rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card-solid);
      box-shadow: var(--shadow);
      font-size: .7rem;
      font-weight: 800;
      animation: float 4s ease-in-out infinite;
    }

    .tag-python {
      right: -18px;
      top: 15%;
      color: var(--blue);
    }

    .tag-ai {
      left: -18px;
      bottom: 14%;
      color: var(--mint);
      animation-delay: -2s;
    }

    @keyframes float {
      50% {
        transform: translateY(-9px);
      }
    }

    .marquee {
      border-block: 1px solid var(--line);
      overflow: hidden;
      background: rgba(255,255,255,.015);
    }

    .marquee-track {
      width: max-content;
      display: flex;
      gap: 3rem;
      padding: 1rem 0;
      animation: marquee 30s linear infinite;
    }

    .marquee-track span {
      color: var(--muted);
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .11em;
      font-weight: 800;
    }

    .marquee-track b {
      color: var(--mint);
      margin-right: 3rem;
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%);
      }
    }

    .about-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: clamp(3rem, 8vw, 7rem);
      align-items: start;
    }

    .about-card {
      position: sticky;
      top: 110px;
      padding: 1.7rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .portrait-mark {
      height: 310px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(145deg, #122f43, #0a182a);
    }

    .portrait-mark::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(123,232,200,.32);
      border-radius: 50%;
    }

    .portrait-mark::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      border: 1px dashed rgba(114,168,255,.35);
      border-radius: 50%;
      animation: spin 18s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .initials {
      position: relative;
      z-index: 1;
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: -.08em;
      color: var(--mint);
    }

    .card-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.2rem;
    }

    .card-caption strong {
      display: block;
    }

    .card-caption span {
      color: var(--muted);
      font-size: .78rem;
    }

    .location-chip {
      flex: 0 0 auto;
      padding: .4rem .65rem;
      border-radius: 999px;
      background: var(--mint-dark);
      color: var(--mint);
      font-size: .66rem;
      font-weight: 800;
    }

    .about-content h2 {
      margin-top: 0;
      font-size: clamp(2.2rem, 4vw, 4rem);
      letter-spacing: -.05em;
      line-height: 1.08;
    }

    .about-content > p {
      color: var(--muted);
      font-size: 1.08rem;
    }

    .principles {
      margin-top: 2.5rem;
      display: grid;
      gap: .8rem;
    }

    .principle {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      padding: 1.2rem 0;
      border-top: 1px solid var(--line);
    }

    .principle-number {
      color: var(--mint);
      font-size: .78rem;
      font-weight: 800;
    }

    .principle h3 {
      margin: 0 0 .25rem;
      font-size: 1rem;
    }

    .principle p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .skills-section {
      background: linear-gradient(
        180deg,
        transparent,
        rgba(114,168,255,.045),
        transparent
      );
    }

    .skill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .skill-card {
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      transition: transform .25s, border-color .25s;
    }

    .skill-card:hover {
      transform: translateY(-6px);
      border-color: rgba(123,232,200,.4);
    }

    .skill-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 13px;
